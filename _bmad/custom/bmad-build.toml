# Team overrides for bmad-build workflow.
# Committed to the repo — applies to every developer on the project.
# Survives BMad framework upgrades (never touched by the installer).

[workflow]

# Pre-flight gates: run after greeting, before step-01 begins.
activation_steps_append = [
  """GATE — Clean working tree required.
Run `git status --porcelain` in the project root.
If output is non-empty (modified, staged, or untracked files exist):
  Output: GATE_RESULT: clean_working_tree = FAIL
  List the uncommitted changes detected.
  HALT: "Working tree must be clean before starting development."
Otherwise output: GATE_RESULT: clean_working_tree = PASS""",

  """GATE — Unit test baseline.
Run `make test 2>&1` in the project root.
If exit code is non-zero:
  Output: GATE_RESULT: unit_test_baseline = FAIL
  HALT: "Unit tests must pass before starting development."
Otherwise output: GATE_RESULT: unit_test_baseline = PASS""",

  """GATE — Integration test baseline.
Run `make integration 2>&1` in the project root.
If exit code is non-zero:
  Output: GATE_RESULT: integration_test_baseline = FAIL
  HALT: "Integration tests must pass before starting development."
Otherwise output: GATE_RESULT: integration_test_baseline = PASS""",
]

# Post-completion gate: executed after the build is marked complete (step-05 / oneshot finalize).
on_complete = """GATE — Post-review regression and helm chart check.

1. Run `make test 2>&1` in the project root.
   If exit code is non-zero:
     Output: GATE_RESULT: post_review_unit_tests = FAIL
     HALT: "Unit tests must pass after code review. Fix regressions."
   Otherwise output: GATE_RESULT: post_review_unit_tests = PASS

2. Run `make integration 2>&1` in the project root.
   If exit code is non-zero:
     Output: GATE_RESULT: post_review_integration_tests = FAIL
     HALT: "Integration tests must pass after code review. Fix regressions."
   Otherwise output: GATE_RESULT: post_review_integration_tests = PASS

3. Run `make helmchart-test 2>&1` in the project root.
   If exit code is non-zero:
     Output: GATE_RESULT: post_review_helmchart_test = FAIL
     HALT: "Helm chart tests must pass after code review. Fix regressions."
   Otherwise output: GATE_RESULT: post_review_helmchart_test = PASS

4. Ensure the dev agent record is filled out in the story/plan file.
   Look for `## Dev Agent Record` (or `## Auto Run Result` or equivalent agent-record section).
   If the section is missing or empty (no model, no summary, no outcome recorded):
     Output: GATE_RESULT: dev_agent_record = FAIL
     HALT: "Dev agent record must be filled out before completing the story. Add ## Dev Agent Record with: Model Used, Summary of Changes, Outcome, and any Notes."
   Otherwise output: GATE_RESULT: dev_agent_record = PASS

5. Update sprint-status.yaml.
   Run `python3 ./scripts/finalize-story.py {story_key} --impl-dir {implementation_artifacts}` if the finalize script exists, where {story_key} is derived from the plan/story file name.
   If the script does not exist, manually update the story's status in `_bmad-output/implementation-artifacts/sprint-status.yaml` to reflect the current state (e.g. `review` or `done`).
   Output: GATE_RESULT: sprint_status_updated = PASS"""
