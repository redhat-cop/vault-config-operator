# Team overrides for bmad-epic-dev workflow.
# Committed to the repo — applies to every developer on the project.
# Survives BMad framework upgrades (never touched by the installer).
#
# NOTE: bmad-epic-dev does not auto-resolve customize.toml (yet).
# This file documents a binding team rule that the orchestrator agent
# MUST respect when running the review loop in Phase B.

[workflow]

persistent_facts = [
  """CODE REVIEW ITERATION CAP (MANDATORY — max 5 rounds):
The review-fix loop (Phase B Steps 2→3→2→3…) is capped at 5 iterations per story.
Track the iteration count starting at 1 for the first code review pass.

- Iterations 1–4: normal behavior — if changes_requested, fix and re-review.
- Iteration 5 (FINAL): run code review one last time. Regardless of the outcome:
  - If approved: proceed normally.
  - If changes_requested: do NOT start a 6th iteration. Instead:
    1. HALT the story pipeline immediately.
    2. Summarize ALL open/unresolved review findings in a clear list.
    3. Include the iteration history (what was fixed in each round, what persists).
    4. Present to the user: "⚠️ Review cap reached (5/5 iterations) for story {story_key}. Human intervention needed."
    5. Wait for the user to decide: resolve manually, accept as-is, or abandon.
    6. Only proceed after explicit user approval.

This prevents infinite review loops and ensures human judgment on unresolvable findings.""",

  """PHASE B STORY FINALIZATION (MANDATORY — code gate, not a doc rule):
After a story is reviewed (approved or accept-as-is), the orchestrator MUST run:
  python3 ./scripts/finalize-story.py {story-key} --impl-dir {implementation_artifacts}
Do NOT hand-edit sprint-status.yaml to `done`. The script:
  1. Requires ## Code Review Record with a non-empty Review Model Used
  2. Sets the story file Status: to done
  3. Sets the matching sprint-status key to done in the same invocation
  4. Exits non-zero if the review record is missing — HALT, fill the record, re-run
After each layer, and on resume, run:
  python3 ./scripts/finalize-story.py --check-epic {N} --impl-dir {implementation_artifacts}
If that check fails, HALT. Do not start the next layer or continue the epic.
This replaces the documentation-only atomicity guards that failed in Epics 12–15.""",
]
