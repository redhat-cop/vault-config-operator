# Team overrides for bmad-dev-story workflow.
# Committed to the repo — applies to every developer on the project.
# Survives BMad framework upgrades (never touched by the installer).
#
# NOTE on test responsibility split (updated 2026-08-14):
# - Unit tests (`make test`): owned by the dev subagent — runs pre-flight, per-task, and on-complete.
# - Integration tests (`make integration`): owned by the bmad-epic-dev orchestrator —
#   runs once per layer as baseline and once per story as pre-merge gate.
#   Dev subagents do NOT run `make integration`.
# - When running bmad-dev-story standalone (not via bmad-epic-dev), the on_complete gate
#   runs the full test suite including `make integration` as a safety net.

[workflow]

# Pre-flight gates: run after greeting, before story execution begins.
# The agent interprets these as sequential instructions.
activation_steps_append = [
  """GATE — Clean working tree required.
Run `git status --porcelain` in the project root.
If output is non-empty (modified, staged, or untracked files exist):
  Output: GATE_RESULT: clean_working_tree = FAIL
  List the uncommitted changes detected.
  HALT: "Working tree must be clean before starting story development."
Otherwise output: GATE_RESULT: clean_working_tree = PASS""",

  """GATE — Unit test baseline.
Run `make test 2>&1` in the project root.
If exit code is non-zero:
  Output: GATE_RESULT: unit_test_baseline = FAIL
  HALT: "Unit tests must pass before starting story development."
Otherwise output: GATE_RESULT: unit_test_baseline = PASS""",
]

# Post-completion gate: executed at Step 11, after story is marked for review.
# When running standalone (not via bmad-epic-dev), also runs integration tests.
on_complete = """GATE — Post-completion regression check.
Run `make test 2>&1` in the project root.
If exit code is non-zero:
  Output: GATE_RESULT: post_completion_unit_tests = FAIL
  HALT: "Unit tests must pass before the story can be marked for review. Fix regressions."
Otherwise output: GATE_RESULT: post_completion_unit_tests = PASS

If NOT running under the bmad-epic-dev orchestrator (i.e. standalone dev-story execution),
also run `make integration 2>&1` as a safety net.
If exit code is non-zero:
  Output: GATE_RESULT: post_completion_integration_tests = FAIL
  HALT: "Integration tests must pass before the story can be marked for review."
Otherwise output: GATE_RESULT: post_completion_integration_tests = PASS"""
