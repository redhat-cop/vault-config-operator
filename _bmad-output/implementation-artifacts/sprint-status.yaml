  # --- Phase 3: System Backend API Coverage ---

  # Epic 17: System Backend Configuration CRDs
  # Scope: 8 new CRDs covering configurable /sys/ endpoints (OSS Vault only, no Enterprise-only APIs)
  # Framework: All use existing VaultObject + VaultEndpoint + VaultResource generic reconciler — no framework changes needed
  # Excluded from scope: Plugin APIs (/sys/plugins/*), operational/read-only endpoints, Enterprise-only endpoints
  epic-17: in-progress

  # Story 17.0: Vault API Observability — Metrics + Reconcile Trace Logging
  # Addresses: https://github.com/redhat-cop/vault-config-operator/issues/193
  # Related PR (stale, never merged): https://github.com/redhat-cop/vault-config-operator/pull/194
  # Part A — Vault API HTTP Metrics:
  #   - Create instrumentedRoundTripper wrapping http.RoundTripper on vault.Config.HttpClient.Transport
  #   - Record prometheus CounterVec (vault_api_requests_total: method, path, status_code)
  #   - Record prometheus HistogramVec (vault_api_request_duration_seconds: method, path)
  #   - Register with controller-runtime metrics.Registry (already serves /metrics on :8443)
  #   - Inject in getConnectionConfig() and createVaultClient() in commons.go
  #   - Implement normalizePath() to prevent cardinality explosion (collapse named segments)
  #   - No new dependencies — prometheus/client_golang already transitive
  # Part B — High-Verbosity Reconcile Trace Logging:
  #   - Add V(6) log lines in VaultEndpoint.CreateOrUpdate: read result, drift decision, write/skip
  #   - Add V(6) log lines in VaultEndpoint.DeleteIfExists, VaultAuditEndpoint, VaultEngineEndpoint
  #   - Add V(6) log lines in ReconcileWithFunctions: event type, cleanup/reconcile path taken
  #   - Only visible when operator runs with -v=6 or higher — zero noise at default verbosity
  # Complexity: Medium (framework-level change touching shared utils, needs careful testing)
  # Design note: Part A is metrics infrastructure — benefits all 80+ existing CRDs immediately
  17-0-vault-api-observability-metrics-and-reconcile-trace-logging: done

  # Story 17.1: Quota Management CRDs (QuotaConfig + RateLimitQuota + LeaseCountQuota)
  # Closes: https://github.com/redhat-cop/vault-config-operator/issues/249
  # - QuotaConfig: singleton /sys/quotas/config — enable/disable rate limit quotas, exempt paths
  # - RateLimitQuota: /sys/quotas/rate-limit/{name} — per-mount or global rate limit quotas
  # - LeaseCountQuota: /sys/quotas/lease-count/{name} — per-mount or global lease count caps
  # Vault API: https://developer.hashicorp.com/vault/api-docs/system/quotas-config
  #            https://developer.hashicorp.com/vault/api-docs/system/rate-limit-quotas
  #            https://developer.hashicorp.com/vault/api-docs/system/lease-count-quotas
  # Complexity: Medium (3 CRDs, singleton + 2 named resources, highest user-facing value)
  17-1-quota-management-crds-quotaconfig-ratelimitquota-leasecountquota: done

  # Story 17.2: System Configuration Singleton CRDs (CORSConfig + KeyRotationConfig)
  # - CORSConfig: singleton /sys/config/cors — enable/configure CORS for Vault API
  # - KeyRotationConfig: singleton /sys/rotate/config — automatic barrier key rotation schedule
  # Vault API: https://developer.hashicorp.com/vault/api-docs/system/config-cors
  #            https://developer.hashicorp.com/vault/api-docs/system/rotate-config
  # Complexity: Low (2 singleton CRDs; CORSConfig: DELETE disables, PUT enables; KeyRotationConfig: simple PUT)
  # Design note: Singleton resources — document one-per-cluster convention, consider validating webhook
  17-2-system-config-singleton-crds-corsconfig-keyrotationconfig: done

  # Story 17.3: Rotation Policy CRD (RotationPolicy)
  # - RotationPolicy: /sys/policies/rotation/{name} — automatic credential rotation schedules
  # Vault API: https://developer.hashicorp.com/vault/api-docs/system/policies-rotation
  # Complexity: Low (1 CRD, follows existing Policy/PasswordPolicy pattern closely)
  17-3-rotation-policy-crd: done

  # Story 17.4: UI and Observability CRDs (UICustomHeader + LoggerConfig)
  # - UICustomHeader: /sys/config/ui/headers/{name} — custom response headers for UI
  # - LoggerConfig: /sys/loggers/{name} — runtime log level per named logger
  # Vault API: https://developer.hashicorp.com/vault/api-docs/system/config-ui
  #            https://developer.hashicorp.com/vault/api-docs/system/loggers
  # Complexity: Low (2 CRDs, simple key-value configs)
  # Design note: LoggerConfig resets on Vault restart — operator re-applies on reconcile (documented behavior)
  17-4-ui-and-observability-crds-uicustomheader-loggerconfig: done

  # Story 17.5: Reflective toMap via vault Struct Tags + VaultObject Interface Simplification
  # - Part A0 (PREREQUISITE) — toMap/IsEquivalentToDesiredState unit test audit + gap fill
  #   - Audit all 88 types for toMap unit test coverage; fill gaps for 8 untested types
  #   - Every type must have: toMap output test, IsEquivalentToDesiredState positive + negative + extra-fields tests
  #   - These tests become the regression oracle — they MUST pass before AND after the walker migration
  # - Part A1 — StructToVaultPayload runtime reflection walker with extended tag grammar
  #   - Tag grammar: vault:"<key>[,<codec>][,omitempty][,when=Field:value][,default=X][,spreadmap]" | vault:"-" | vault:",inline"
  #   - Codecs: identity, duration, number, intmap, stringmap
  #   - Directives: omitempty, when=Field:value (conditional include), default=X (pointer-nil default), spreadmap (merge map into parent), inline, -
  #   - Implement in api/v1alpha1/utils/ as StructToVaultPayload(any) map[string]any
  #   - All 88 types eligible with extended grammar; only TransitSecretEngineKey keeps hand-written toMap/configToMap (two maps from one struct)
  #   - Credential-override types: move override logic from toMap into PrepareInternalValues; tag retrieved* fields normally
  #   - Apply to all new Epic 17 CRDs; migrate all existing types except Transit
  #   - All Part A0 unit tests must pass unchanged after migration
  # - Part B — Default IsEquivalentToDesiredState via optional VaultEquivalenceChecker interface
  # - Part C — Optional interface methods (IsInitialized, IsValid, PrepareInternalValues, PrepareTLSConfig) — deletes ~275 no-ops
  # - Part D — ResourceName helper for spec.Name-vs-metadata.Name in GetPath
  # Complexity: High (touches every type file; Part A0 test audit is prerequisite gate)
  # Novelty Risk: HIGH — shared framework refactor across all 88 types
  # Safety: Part A0 builds comprehensive test oracle BEFORE migration; integration tests provide end-to-end regression
  17-5-reflective-tomap-and-vaultobject-interface-simplification: done

  # Story 17.6: Generic Reconciler + Error Handling Enforcement
  # - Part A — Generic VaultResource reconciler using Go generics (Go 1.18+ type params, we're on 1.27)
  #   - GenericVaultReconciler[T, PT] replaces the identical 70-line Reconcile() body in ~70 controller files
  #   - Per-type controller files shrink to RBAC comments + SetupWithManager one-liner
  #   - ~10 controllers with custom logic (PKI, Transit, RandomSecret, VaultSecret, etc.) keep hand-written Reconcile
  # - Part B — Error handling enforcement
  #   - Enable errcheck linter in .golangci.yml (currently not enabled — only standard linters + staticcheck)
  #   - Fix all existing errcheck violations: every function returning error must have the error checked and logged
  #   - Add errcheck to CI pipeline as blocking gate
  # Complexity: High (Part A touches every controller file; Part B is a sweep with potential behavior changes)
  # Novelty Risk: MEDIUM — generics are well-understood in Go 1.27; errcheck is mechanical
  17-6-generic-reconciler-and-error-handling-enforcement: done

