apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-kubernetessecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - kubernetessecretengineconfigs
  validations:
  # jwtReference.randomSecret forbidden
  - expression: >-
      !has(object.spec.jwtReference.randomSecret)
    message: "spec.jwtReference.randomSecret is not allowed; only vaultSecret or secret can be specified"
  # jwtReference exactly-one source (vaultSecret or secret)
  - expression: >-
      (has(object.spec.jwtReference.vaultSecret) ? 1 : 0) +
      (has(object.spec.jwtReference.secret) ? 1 : 0) == 1
    message: "exactly one of spec.jwtReference.vaultSecret or spec.jwtReference.secret must be specified"
