apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-totpsecretenginekey
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - totpsecretenginekeys
  validations:
  # issuer required
  - expression: >-
      has(object.spec.issuer) && object.spec.issuer != ""
    message: "spec.issuer is required to ensure drift detection works correctly"
  # accountName required
  - expression: >-
      has(object.spec.accountName) && object.spec.accountName != ""
    message: "spec.accountName is required to ensure drift detection works correctly"
  # generate=true: key forbidden
  - expression: >-
      !object.spec.generate ||
      !has(object.spec.key) || object.spec.key == ""
    message: "spec.key cannot be set when spec.generate is true"
  # generate=true: url forbidden
  - expression: >-
      !object.spec.generate ||
      !has(object.spec.url) || object.spec.url == ""
    message: "spec.url cannot be set when spec.generate is true"
  # generate=false: key or url required
  - expression: >-
      object.spec.generate ||
      (has(object.spec.key) && object.spec.key != "") ||
      (has(object.spec.url) && object.spec.url != "")
    message: "one of spec.key or spec.url is required when spec.generate is false"
  # generate=false: exported forbidden
  - expression: >-
      object.spec.generate ||
      !has(object.spec.exported)
    message: "spec.exported cannot be set when spec.generate is false"
  # generate=false: keySize forbidden
  - expression: >-
      object.spec.generate ||
      !has(object.spec.keySize) || object.spec.keySize == 0
    message: "spec.keySize cannot be set when spec.generate is false"
  # UPDATE immutability: generate
  - expression: >-
      request.operation == "CREATE" ||
      object.spec.generate == oldObject.spec.generate
    message: "spec.generate cannot be updated after key creation"
  # UPDATE immutability: key
  - expression: >-
      request.operation == "CREATE" ||
      ((!has(object.spec.key) || object.spec.key == "") && (!has(oldObject.spec.key) || oldObject.spec.key == "")) ||
      (has(object.spec.key) && has(oldObject.spec.key) && object.spec.key == oldObject.spec.key)
    message: "spec.key cannot be updated after key creation"
  # UPDATE immutability: url
  - expression: >-
      request.operation == "CREATE" ||
      ((!has(object.spec.url) || object.spec.url == "") && (!has(oldObject.spec.url) || oldObject.spec.url == "")) ||
      (has(object.spec.url) && has(oldObject.spec.url) && object.spec.url == oldObject.spec.url)
    message: "spec.url cannot be updated after key creation"
  # UPDATE immutability: keySize
  - expression: >-
      request.operation == "CREATE" ||
      object.spec.keySize == oldObject.spec.keySize
    message: "spec.keySize cannot be updated after key creation"
  # UPDATE immutability: exported (pointer)
  - expression: >-
      request.operation == "CREATE" ||
      ((!has(object.spec.exported) && !has(oldObject.spec.exported)) ||
       (has(object.spec.exported) && has(oldObject.spec.exported) && object.spec.exported == oldObject.spec.exported))
    message: "spec.exported cannot be updated after key creation"
  # UPDATE immutability: skew (pointer)
  - expression: >-
      request.operation == "CREATE" ||
      ((!has(object.spec.skew) && !has(oldObject.spec.skew)) ||
       (has(object.spec.skew) && has(oldObject.spec.skew) && object.spec.skew == oldObject.spec.skew))
    message: "spec.skew cannot be updated after key creation"
  # UPDATE immutability: qrSize (pointer)
  - expression: >-
      request.operation == "CREATE" ||
      ((!has(object.spec.qrSize) && !has(oldObject.spec.qrSize)) ||
       (has(object.spec.qrSize) && has(oldObject.spec.qrSize) && object.spec.qrSize == oldObject.spec.qrSize))
    message: "spec.qrSize cannot be updated after key creation"
