apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-databasesecretenginestaticrole
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - databasesecretenginestaticroles
  validations:
  # rotationPeriod and rotationSchedule mutually exclusive
  - expression: >-
      !(has(object.spec.rotationPeriod) && has(object.spec.rotationSchedule) && object.spec.rotationSchedule != "")
    message: "spec.rotationPeriod and spec.rotationSchedule are mutually exclusive; set one but not both"
  # at least one of rotationPeriod or rotationSchedule
  - expression: >-
      has(object.spec.rotationPeriod) ||
      (has(object.spec.rotationSchedule) && object.spec.rotationSchedule != "")
    message: "one of spec.rotationPeriod or spec.rotationSchedule must be set"
  # rotationWindow only with rotationSchedule
  - expression: >-
      !has(object.spec.rotationWindow) ||
      (has(object.spec.rotationSchedule) && object.spec.rotationSchedule != "")
    message: "spec.rotationWindow is only valid when spec.rotationSchedule is set"
  # passwordCredentialConfig / rsaPrivateKeyCredentialConfig exactly one
  - expression: >-
      (has(object.spec.passwordCredentialConfig) ? 1 : 0) +
      (has(object.spec.rsaPrivateKeyCredentialConfig) ? 1 : 0) == 1
    message: "only one of spec.passwordCredentialConfig or spec.rsaPrivateKeyCredentialConfig can be specified"
