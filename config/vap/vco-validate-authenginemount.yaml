apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-authenginemount
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["UPDATE"]
      resources:
      - authenginemounts
  validations:
  - expression: >-
      object.spec.description == oldObject.spec.description &&
      object.spec.type == oldObject.spec.type &&
      object.spec.local == oldObject.spec.local &&
      object.spec.sealwrap == oldObject.spec.sealwrap
    message: "only .spec.config can be modified"
