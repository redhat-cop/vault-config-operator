apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-ldapsecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - ldapsecretengineconfigs
  validations:
  # bindCredentials exactly-one source
  - expression: |
      (has(object.spec.bindCredentials.vaultSecret) ? 1 : 0) +
      (has(object.spec.bindCredentials.secret) ? 1 : 0) +
      (has(object.spec.bindCredentials.randomSecret) ? 1 : 0) == 1
    message: "exactly one of spec.bindCredentials.vaultSecret, spec.bindCredentials.secret, or spec.bindCredentials.randomSecret must be specified"
  # bindDN required when using randomSecret
  - expression: >-
      !has(object.spec.bindCredentials.randomSecret) ||
      (has(object.spec.bindDN) && object.spec.bindDN != "")
    message: "spec.bindDN must be set when using randomSecret credentials (randomSecret only provides the bind password)"
