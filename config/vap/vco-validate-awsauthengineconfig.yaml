apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-awsauthengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - awsauthengineclientconfigs
  validations:
  - expression: |
      (has(object.spec.AWSCredentials.vaultSecret) ? 1 : 0) +
      (has(object.spec.AWSCredentials.secret) ? 1 : 0) +
      (has(object.spec.AWSCredentials.randomSecret) ? 1 : 0) == 1
    message: "exactly one of spec.AWSCredentials.vaultSecret, spec.AWSCredentials.secret, or spec.AWSCredentials.randomSecret must be specified"
