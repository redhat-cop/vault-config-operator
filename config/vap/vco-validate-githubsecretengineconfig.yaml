apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-githubsecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - githubsecretengineconfigs
  validations:
  # exactly one of sshKeyReference.vaultSecret or sshKeyReference.secret (no randomSecret)
  - expression: >-
      (has(object.spec.sSHKeyReference.vaultSecret) ? 1 : 0) +
      (has(object.spec.sSHKeyReference.secret) ? 1 : 0) == 1
    message: "only one of spec.sSHKeyReference.vaultSecret or spec.sSHKeyReference.secret can be specified"
