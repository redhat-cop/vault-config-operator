apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-terraformcloudsecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - terraformcloudsecretengineconfigs
  validations:
  # tfcCredentials exactly-one source
  - expression: |
      (has(object.spec.tfcCredentials.vaultSecret) ? 1 : 0) +
      (has(object.spec.tfcCredentials.secret) ? 1 : 0) +
      (has(object.spec.tfcCredentials.randomSecret) ? 1 : 0) == 1
    message: "exactly one of spec.tfcCredentials.vaultSecret, spec.tfcCredentials.secret, or spec.tfcCredentials.randomSecret must be specified"
  # passwordKey required when secret or vaultSecret is used
  - expression: >-
      (!has(object.spec.tfcCredentials.secret) && !has(object.spec.tfcCredentials.vaultSecret)) ||
      (has(object.spec.tfcCredentials.passwordKey) && object.spec.tfcCredentials.passwordKey != "")
    message: "spec.tfcCredentials.passwordKey must not be empty when a credential source is specified"
