apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-awssecretenginerole
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - awssecretengineroles
  validations:
  # externalID only for assumed_role
  - expression: >-
      object.spec.credentialType == "assumed_role" ||
      !has(object.spec.externalID) || object.spec.externalID == ""
    message: "spec.externalID is only allowed when credentialType is assumed_role"
  # sessionTags only for assumed_role
  - expression: >-
      object.spec.credentialType == "assumed_role" ||
      !has(object.spec.sessionTags) || size(object.spec.sessionTags) == 0
    message: "spec.sessionTags is only allowed when credentialType is assumed_role"
  # iamTags only for iam_user
  - expression: >-
      object.spec.credentialType == "iam_user" ||
      !has(object.spec.iamTags) || size(object.spec.iamTags) == 0
    message: "spec.iamTags is only allowed when credentialType is iam_user"
  # userPath only for iam_user
  - expression: >-
      object.spec.credentialType == "iam_user" ||
      !has(object.spec.userPath) || object.spec.userPath == ""
    message: "spec.userPath is only allowed when credentialType is iam_user"
  # permissionsBoundaryARN only for iam_user
  - expression: >-
      object.spec.credentialType == "iam_user" ||
      !has(object.spec.permissionsBoundaryARN) || object.spec.permissionsBoundaryARN == ""
    message: "spec.permissionsBoundaryARN is only allowed when credentialType is iam_user"
  # defaultSTSTTL only for assumed_role or federation_token
  - expression: >-
      object.spec.credentialType == "assumed_role" ||
      object.spec.credentialType == "federation_token" ||
      !has(object.spec.defaultSTSTTL) || object.spec.defaultSTSTTL == ""
    message: "spec.defaultSTSTTL is only allowed when credentialType is assumed_role or federation_token"
  # maxSTSTTL only for assumed_role or federation_token
  - expression: >-
      object.spec.credentialType == "assumed_role" ||
      object.spec.credentialType == "federation_token" ||
      !has(object.spec.maxSTSTTL) || object.spec.maxSTSTTL == ""
    message: "spec.maxSTSTTL is only allowed when credentialType is assumed_role or federation_token"
  # iamGroups not allowed for session_token
  - expression: >-
      object.spec.credentialType != "session_token" ||
      !has(object.spec.iamGroups) || size(object.spec.iamGroups) == 0
    message: "spec.iamGroups is not allowed when credentialType is session_token"
  # roleArns required for assumed_role
  - expression: >-
      object.spec.credentialType != "assumed_role" ||
      (has(object.spec.roleArns) && size(object.spec.roleArns) > 0)
    message: "spec.roleArns is required when credentialType is assumed_role"
  # roleArns only for assumed_role
  - expression: >-
      object.spec.credentialType == "assumed_role" ||
      !has(object.spec.roleArns) || size(object.spec.roleArns) == 0
    message: "spec.roleArns is only allowed when credentialType is assumed_role"
  # policyArns not allowed for session_token
  - expression: >-
      object.spec.credentialType != "session_token" ||
      !has(object.spec.policyArns) || size(object.spec.policyArns) == 0
    message: "spec.policyArns is not allowed when credentialType is session_token"
  # policyDocument not allowed for session_token
  - expression: >-
      object.spec.credentialType != "session_token" ||
      !has(object.spec.policyDocument) || object.spec.policyDocument == ""
    message: "spec.policyDocument is not allowed when credentialType is session_token"
