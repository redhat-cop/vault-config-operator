apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-oktaauthengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - oktaauthengineconfigs
  validations:
  - expression: |
      (has(object.spec.oktaCredentials.vaultSecret) ? 1 : 0) +
      (has(object.spec.oktaCredentials.secret) ? 1 : 0) +
      (has(object.spec.oktaCredentials.randomSecret) ? 1 : 0) == 1
    message: "exactly one of spec.oktaCredentials.vaultSecret, spec.oktaCredentials.secret, or spec.oktaCredentials.randomSecret must be specified"
