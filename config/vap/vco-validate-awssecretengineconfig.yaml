apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-awssecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - awssecretengineconfigs
  validations:
  # rootCredentials exactly-one source (folded from shared VAP since this CRD has extra rules)
  - expression: |
      (has(object.spec.rootCredentials.vaultSecret) ? 1 : 0) +
      (has(object.spec.rootCredentials.secret) ? 1 : 0) +
      (has(object.spec.rootCredentials.randomSecret) ? 1 : 0) == 1
    message: "exactly one of spec.rootCredentials.vaultSecret, spec.rootCredentials.secret, or spec.rootCredentials.randomSecret must be specified"
  # accessKey required when using randomSecret
  - expression: >-
      !has(object.spec.rootCredentials.randomSecret) ||
      (has(object.spec.accessKey) && object.spec.accessKey != "")
    message: "spec.accessKey must be set when using randomSecret credentials (randomSecret only provides the secret key)"
