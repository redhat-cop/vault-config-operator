apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-pkisecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - pkisecretengineconfigs
  validations:
  - expression: >-
      !has(object.spec.acme) || has(object.spec.cluster)
    message: "spec.acme requires spec.cluster to be set"
