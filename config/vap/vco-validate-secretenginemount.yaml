apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-secretenginemount
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["UPDATE"]
      resources:
      - secretenginemounts
  validations:
  - expression: >-
      (has(object.spec.type) ? object.spec.type : "") == (has(oldObject.spec.type) ? oldObject.spec.type : "") &&
      (has(object.spec.description) ? object.spec.description : "") == (has(oldObject.spec.description) ? oldObject.spec.description : "") &&
      (has(object.spec.local) ? object.spec.local : false) == (has(oldObject.spec.local) ? oldObject.spec.local : false) &&
      (has(object.spec.sealWrap) ? object.spec.sealWrap : false) == (has(oldObject.spec.sealWrap) ? oldObject.spec.sealWrap : false) &&
      (has(object.spec.externalEntropyAccess) ? object.spec.externalEntropyAccess : false) == (has(oldObject.spec.externalEntropyAccess) ? oldObject.spec.externalEntropyAccess : false) &&
      ((!has(object.spec.options) && !has(oldObject.spec.options)) ||
       (has(object.spec.options) && has(oldObject.spec.options) &&
        object.spec.options == oldObject.spec.options))
    message: "only .spec.config can be modified"
