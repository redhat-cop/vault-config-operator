apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-secretenginemount
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["UPDATE"]
      resources:
      - secretenginemounts
  validations:
  - expression: >-
      object.spec.type == oldObject.spec.type &&
      object.spec.description == oldObject.spec.description &&
      object.spec.local == oldObject.spec.local &&
      object.spec.sealWrap == oldObject.spec.sealWrap &&
      object.spec.externalEntropyAccess == oldObject.spec.externalEntropyAccess &&
      ((!has(object.spec.options) && !has(oldObject.spec.options)) ||
       (has(object.spec.options) && has(oldObject.spec.options) &&
        object.spec.options == oldObject.spec.options))
    message: "only .spec.config can be modified"
