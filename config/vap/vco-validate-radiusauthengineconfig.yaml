apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-radiusauthengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - radiusauthengineconfigs
  validations:
  - expression: |
      (has(object.spec.radiusCredentials.vaultSecret) ? 1 : 0) +
      (has(object.spec.radiusCredentials.secret) ? 1 : 0) +
      (has(object.spec.radiusCredentials.randomSecret) ? 1 : 0) == 1
    message: "exactly one of spec.radiusCredentials.vaultSecret, spec.radiusCredentials.secret, or spec.radiusCredentials.randomSecret must be specified"
