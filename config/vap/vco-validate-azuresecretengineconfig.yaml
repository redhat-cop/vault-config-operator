apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-azuresecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - azuresecretengineconfigs
  validations:
  - expression: |
      (has(object.spec.azureCredentials.vaultSecret) ? 1 : 0) +
      (has(object.spec.azureCredentials.secret) ? 1 : 0) +
      (has(object.spec.azureCredentials.randomSecret) ? 1 : 0) == 1
    message: "exactly one of spec.azureCredentials.vaultSecret, spec.azureCredentials.secret, or spec.azureCredentials.randomSecret must be specified"
