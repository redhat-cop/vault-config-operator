apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-terraformcloudsecretenginerole
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - terraformcloudsecretengineroles
  validations:
  # credentialType required
  - expression: >-
      has(object.spec.credentialType) && object.spec.credentialType != ""
    message: "spec.credentialType is required and must be one of: team, team_legacy, user, organization"
  # credentialType enum validation
  - expression: >-
      !has(object.spec.credentialType) || object.spec.credentialType == "" ||
      object.spec.credentialType in ["team", "team_legacy", "user", "organization"]
    message: "spec.credentialType must be one of: team, team_legacy, user, organization"
  # userID conflicts with organization/teamID
  - expression: >-
      !has(object.spec.userID) || object.spec.userID == "" ||
      ((!has(object.spec.organization) || object.spec.organization == "") &&
       (!has(object.spec.teamID) || object.spec.teamID == ""))
    message: "spec.userID conflicts with spec.organization and spec.teamID"
  # user type requires userID
  - expression: >-
      object.spec.credentialType != "user" ||
      (has(object.spec.userID) && object.spec.userID != "")
    message: "spec.userID is required when credentialType is \"user\""
  # team/team_legacy requires organization
  - expression: >-
      (object.spec.credentialType != "team" && object.spec.credentialType != "team_legacy") ||
      (has(object.spec.organization) && object.spec.organization != "")
    message: "spec.organization is required when credentialType is \"team\" or \"team_legacy\""
  # team/team_legacy requires teamID
  - expression: >-
      (object.spec.credentialType != "team" && object.spec.credentialType != "team_legacy") ||
      (has(object.spec.teamID) && object.spec.teamID != "")
    message: "spec.teamID is required when credentialType is \"team\" or \"team_legacy\""
  # organization type requires organization
  - expression: >-
      object.spec.credentialType != "organization" ||
      (has(object.spec.organization) && object.spec.organization != "")
    message: "spec.organization is required when credentialType is \"organization\""
  # organization type forbids teamID
  - expression: >-
      object.spec.credentialType != "organization" ||
      !has(object.spec.teamID) || object.spec.teamID == ""
    message: "spec.teamID is not allowed when credentialType is \"organization\""
