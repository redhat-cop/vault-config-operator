apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-consulsecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - consulsecretengineconfigs
  validations:
  # rootCredentials exactly-one source
  - expression: |
      (has(object.spec.rootCredentials.vaultSecret) ? 1 : 0) +
      (has(object.spec.rootCredentials.secret) ? 1 : 0) +
      (has(object.spec.rootCredentials.randomSecret) ? 1 : 0) == 1
    message: "exactly one of spec.rootCredentials.vaultSecret, spec.rootCredentials.secret, or spec.rootCredentials.randomSecret must be specified"
  # clientCert and clientKey both-or-neither
  - expression: >-
      (has(object.spec.clientCert) && object.spec.clientCert != "") ==
      (has(object.spec.clientKey) && object.spec.clientKey != "")
    message: "spec.clientCert and spec.clientKey must both be set or both be empty"
