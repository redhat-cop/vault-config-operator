apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-sshsecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - sshsecretengineconfigs
  validations:
  # generateSigningKey=false → caKeyReference required
  - expression: >-
      object.spec.generateSigningKey ||
      has(object.spec.caKeyReference)
    message: "spec.caKeyReference is required when generateSigningKey is false"
  # caKeyReference.randomSecret forbidden
  - expression: >-
      object.spec.generateSigningKey ||
      !has(object.spec.caKeyReference) ||
      !has(object.spec.caKeyReference.randomSecret)
    message: "spec.caKeyReference.randomSecret is not allowed; only vaultSecret or secret can be specified"
  # caKeyReference credential source validation (exactly one of vaultSecret/secret when not generating)
  - expression: >-
      object.spec.generateSigningKey ||
      !has(object.spec.caKeyReference) ||
      (has(object.spec.caKeyReference.vaultSecret) ? 1 : 0) +
      (has(object.spec.caKeyReference.secret) ? 1 : 0) == 1
    message: "exactly one of spec.caKeyReference.vaultSecret or spec.caKeyReference.secret must be specified when generateSigningKey is false"
