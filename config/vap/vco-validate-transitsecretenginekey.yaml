apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-transitsecretenginekey
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - transitsecretenginekeys
  validations:
  # Rule 1: convergentEncryption requires derived
  - expression: >-
      !(has(object.spec.convergentEncryption) && object.spec.convergentEncryption) ||
      (has(object.spec.derived) && object.spec.derived)
    message: "spec.convergentEncryption requires spec.derived to be true"
  # Rule 2: keySize > 0 only for hmac
  - expression: >-
      !has(object.spec.keySize) || object.spec.keySize == 0 ||
      (has(object.spec.type) ? object.spec.type : "aes256-gcm96") == "hmac"
    message: "spec.keySize is only applicable to hmac key type"
  # Rule 3: hmac keySize >= 32
  - expression: >-
      !has(object.spec.keySize) || object.spec.keySize == 0 ||
      (has(object.spec.type) ? object.spec.type : "aes256-gcm96") != "hmac" ||
      object.spec.keySize >= 32
    message: "spec.keySize must be at least 32 bytes for hmac keys"
  # Rule 4: autoRotatePeriod >= 1h when set and non-zero
  - expression: >-
      !has(object.spec.autoRotatePeriod) ||
      object.spec.autoRotatePeriod == "" ||
      object.spec.autoRotatePeriod == "0" ||
      duration(object.spec.autoRotatePeriod) >= duration("1h")
    message: "spec.autoRotatePeriod must be at least 1h when enabled"
  # Rule 5: spec.type immutable on UPDATE
  - expression: >-
      request.operation == "CREATE" ||
      (has(object.spec.type) ? object.spec.type : "") == (has(oldObject.spec.type) ? oldObject.spec.type : "")
    message: "spec.type cannot be updated after key creation"
  # Rule 6: spec.derived immutable on UPDATE
  - expression: >-
      request.operation == "CREATE" ||
      (has(object.spec.derived) ? object.spec.derived : false) == (has(oldObject.spec.derived) ? oldObject.spec.derived : false)
    message: "spec.derived cannot be updated after key creation"
  # Rule 7: spec.convergentEncryption immutable on UPDATE
  - expression: >-
      request.operation == "CREATE" ||
      (has(object.spec.convergentEncryption) ? object.spec.convergentEncryption : false) == (has(oldObject.spec.convergentEncryption) ? oldObject.spec.convergentEncryption : false)
    message: "spec.convergentEncryption cannot be updated after key creation"
  # Rule 8: spec.keySize immutable on UPDATE
  - expression: >-
      request.operation == "CREATE" ||
      (has(object.spec.keySize) ? object.spec.keySize : 0) == (has(oldObject.spec.keySize) ? oldObject.spec.keySize : 0)
    message: "spec.keySize cannot be updated after key creation"
  # Rule 9: exportable one-way flag (false->true OK, true->false rejected)
  - expression: >-
      request.operation == "CREATE" ||
      !(has(oldObject.spec.exportable) && oldObject.spec.exportable) ||
      (has(object.spec.exportable) && object.spec.exportable)
    message: "spec.exportable cannot be changed from true to false (one-way flag)"
  # Rule 10: allowPlaintextBackup one-way flag
  - expression: >-
      request.operation == "CREATE" ||
      !(has(oldObject.spec.allowPlaintextBackup) && oldObject.spec.allowPlaintextBackup) ||
      (has(object.spec.allowPlaintextBackup) && object.spec.allowPlaintextBackup)
    message: "spec.allowPlaintextBackup cannot be changed from true to false (one-way flag)"
