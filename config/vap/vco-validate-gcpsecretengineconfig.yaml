apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-gcpsecretengineconfig
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - gcpsecretengineconfigs
  validations:
  - expression: |
      (has(object.spec.gcpCredentials.vaultSecret) ? 1 : 0) +
      (has(object.spec.gcpCredentials.secret) ? 1 : 0) +
      (has(object.spec.gcpCredentials.randomSecret) ? 1 : 0) == 1
    message: "exactly one of spec.gcpCredentials.vaultSecret, spec.gcpCredentials.secret, or spec.gcpCredentials.randomSecret must be specified"
