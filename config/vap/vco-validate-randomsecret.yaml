apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: vco-validate-randomsecret
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["redhatcop.redhat.io"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources:
      - randomsecrets
  validations:
  # passwordPolicy mutual exclusivity: exactly one of passwordPolicyName or inlinePasswordPolicy
  - expression: >-
      (has(object.spec.secretFormat.inlinePasswordPolicy) && object.spec.secretFormat.inlinePasswordPolicy != "" ? 1 : 0) +
      (has(object.spec.secretFormat.passwordPolicyName) && object.spec.secretFormat.passwordPolicyName != "" ? 1 : 0) == 1
    message: "only one of InlinePasswordPolicy or passwordPolicyName can be defined"
  # secretKey immutability on UPDATE
  - expression: >-
      request.operation == "CREATE" ||
      object.spec.secretKey == oldObject.spec.secretKey
    message: "spec.secretKey cannot be updated"
  # KVv2 /data/ check
  - expression: >-
      !(has(object.spec.isKVSecretsEngineV2) && object.spec.isKVSecretsEngineV2) ||
      object.spec.path.contains("/data/")
    message: "KVv2 secrets must have /data/ defined in the path, for example /secret-mount-path/data/path"
