{{- if .Values.enableCertManager }}
{{- $issuerRef := .Values.certificate.issuerRef }}
{{- $isDefault := and (eq ($issuerRef.name | default "") "selfsigned-issuer") (eq ($issuerRef.kind | default "") "Issuer") }}
{{- if $isDefault }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-config-operator-webhook-service-cert
spec:
  dnsNames:
  - vault-config-operator-webhook-service.{{ .Release.Namespace }}.svc
  - vault-config-operator-webhook-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- toYaml $issuerRef | nindent 4 }}
  secretName: vault-config-operator-webhook-service-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-config-operator-metrics-service-cert
spec:
  dnsNames:
  - vault-config-operator-controller-manager-metrics-service.{{ .Release.Namespace }}.svc
  - vault-config-operator-controller-manager-metrics-service.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    {{- toYaml $issuerRef | nindent 4 }}
  secretName: vault-config-operator-metrics-service-cert
{{- end }}
