suite: Pod labels tests
templates:
  - manager.yaml
tests:
  - it: keeps only the chart labels by default
    asserts:
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: vault-config-operator
            app.kubernetes.io/instance: RELEASE-NAME
            control-plane: vault-config-operator

  - it: adds podLabels to the pod template
    set:
      podLabels:
        team: platform
        cost-center: "1234"
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: platform
      - equal:
          path: spec.template.metadata.labels.cost-center
          value: "1234"
      - equal:
          path: spec.template.metadata.labels.control-plane
          value: vault-config-operator

  - it: does not change the deployment selector
    set:
      podLabels:
        team: platform
    asserts:
      - notExists:
          path: spec.selector.matchLabels.team
