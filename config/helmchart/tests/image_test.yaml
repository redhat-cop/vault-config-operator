suite: Image registry and repository tests
templates:
  - manager.yaml
tests:
  - it: uses default repository and appVersion tag
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].image
          value: controller:0.0.1

  - it: allows overriding the image tag
    set:
      image.tag: latest
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: controller:latest

  - it: allows setting full repository with tag
    set:
      image.repository: quay.io/redhat-cop/vault-config-operator
      image.tag: 1.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/redhat-cop/vault-config-operator:1.0.0

  - it: composes image from registry and repository
    set:
      image.registry: quay.io
      image.repository: redhat-cop/vault-config-operator
      image.tag: 1.0.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: quay.io/redhat-cop/vault-config-operator:1.0.1

  - it: global imageRegistry overrides per-image registry
    set:
      global.imageRegistry: registry.example.com
      image.registry: quay.io
      image.repository: redhat-cop/vault-config-operator
      image.tag: 2.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/redhat-cop/vault-config-operator:2.0.0

  - it: global imageRegistry prepends to repository when no per-image registry
    set:
      global.imageRegistry: registry.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/controller:0.0.1

  - it: supports templated registry value
    set:
      global.containerImageRegistry: registry.example.com
      image.registry: "{{ .Values.global.containerImageRegistry }}"
      image.repository: redhat-cop/vault-config-operator
      image.tag: 1.0.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/redhat-cop/vault-config-operator:1.0.1

  - it: supports templated global imageRegistry
    set:
      global.containerImageRegistry: registry.example.com
      global.imageRegistry: "{{ .Values.global.containerImageRegistry }}"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.com/controller:0.0.1
