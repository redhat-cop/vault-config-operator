version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - "all"
        - "-QF1003"
        - "-QF1008"
        - "-QF1011"
        - "-QF1012"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1019"
        - "-ST1020"
        - "-ST1021"
        - "-ST1023"
  exclusions:
    generated: strict

formatters:
  enable:
    - gofmt
