apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-postgresql-database
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: docker.io/postgres:16
          env:
            - name: POSTGRES_PASSWORD
              value: testpassword123
            - name: POSTGRES_DB
              value: testdb
          ports:
            - containerPort: 5432
              name: postgresql
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      volumes:
        - name: init-scripts
          configMap:
            name: postgresql-init
