apiVersion: redhatcop.redhat.io/v1alpha1
kind: VaultSecret
metadata:
  name: randomsecret-typed
spec:
  vaultSecretDefinitions:
    - authentication:
        path: kubernetes
        role: secret-reader
        serviceAccount:
          name: default
      name: randomsecret
      path: test-vault-config-operator/kv/randomsecret-password
  output:
    name: randomsecret-typed
    stringData:
      username: vault-user
      password: '{{ .randomsecret.password }}'
    type: kubernetes.io/basic-auth
  refreshPeriod: 3m0s
