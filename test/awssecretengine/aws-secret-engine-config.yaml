apiVersion: redhatcop.redhat.io/v1alpha1
kind: AWSSecretEngineConfig
metadata:
  name: aws-config
spec:
  authentication:
    path: kubernetes
    role: aws-engine-admin
  path: aws
  region: us-west-2
  iamEndpoint: https://iam.amazonaws.com
  stsEndpoint: https://sts.us-west-2.amazonaws.com
  rootCredentials:
    secret:
      name: aws-root-credentials
    usernameKey: access_key
    passwordKey: secret_key
