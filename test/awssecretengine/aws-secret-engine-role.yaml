apiVersion: redhatcop.redhat.io/v1alpha1
kind: AWSSecretEngineRole
metadata:
  name: aws-developer-role
spec:
  authentication:
    path: kubernetes
    role: aws-engine-admin
  path: aws
  credentialType: assumed_role
  roleArns:
    - arn:aws:iam::123456789012:role/DeveloperRole
  policyArns:
    - arn:aws:iam::123456789012:policy/DeveloperPolicy
  defaultSTSTTL: 1h
  maxSTSTTL: 4h
