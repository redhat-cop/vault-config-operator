apiVersion: redhatcop.redhat.io/v1alpha1
kind: MongoDBAtlasSecretEngineConfig
metadata:
  name: mongodb-atlas-config
spec:
  authentication:
    path: kubernetes
    role: atlas-engine-admin
  path: mongodbatlas
  rootCredentials:
    secret:
      name: atlas-api-credentials
    usernameKey: public_key
    passwordKey: private_key
