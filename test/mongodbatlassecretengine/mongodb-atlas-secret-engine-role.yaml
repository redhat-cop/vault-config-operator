apiVersion: redhatcop.redhat.io/v1alpha1
kind: MongoDBAtlasSecretEngineRole
metadata:
  name: mongodb-atlas-role
spec:
  authentication:
    path: kubernetes
    role: atlas-engine-admin
  path: mongodbatlas
  organizationID: "5cf5a45a9ccf6400e60981b6"
  roles:
    - ORG_READ_ONLY
  ipAddresses:
    - "192.168.1.3"
    - "192.168.1.4"
  ttl: "30m"
  maxTTL: "1h"
