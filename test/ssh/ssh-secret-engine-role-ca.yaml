apiVersion: redhatcop.redhat.io/v1alpha1
kind: SSHSecretEngineRole
metadata:
  name: test-ssh-role-ca
spec:
  authentication:
    path: kubernetes
    role: policy-admin
  path: test-ssh/test-ssh-mount
  keyType: ca
  allowUserCertificates: true
  allowedUsers: "*"
  defaultExtensions:
    permit-pty: ""
  ttl: "4h"
  maxTTL: "768h"
