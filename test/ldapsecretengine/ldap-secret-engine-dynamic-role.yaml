apiVersion: redhatcop.redhat.io/v1alpha1
kind: LDAPSecretEngineDynamicRole
metadata:
  name: test-ldapse-dynamic-role
spec:
  authentication:
    path: kubernetes
    role: policy-admin
  path: test-ldapse/test-ldapse-mount
  creationLDIF: |
    dn: uid={{.Username}},ou=Users,dc=example,dc=com
    changetype: add
    objectClass: inetOrgPerson
    objectClass: top
    cn: {{.Username}}
    sn: generated
    uid: {{.Username}}
    userPassword: {{.Password}}
  deletionLDIF: |
    dn: uid={{.Username}},ou=Users,dc=example,dc=com
    changetype: delete
  rollbackLDIF: |
    dn: uid={{.Username}},ou=Users,dc=example,dc=com
    changetype: delete
  defaultTTL: "1h"
  maxTTL: "24h"
