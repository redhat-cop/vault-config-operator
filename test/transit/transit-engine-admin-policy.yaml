apiVersion: redhatcop.redhat.io/v1alpha1
kind: Policy
metadata:
  name: transit-engine-admin
spec:
  authentication:
    path: kubernetes
    role: policy-admin
  policy: |
    # query existing mounts
    path "/sys/mounts" {
      capabilities = [ "list", "read"]
      allowed_parameters = {
        "type" = ["transit"]
        "*"   = []
      }
    }

    path "/sys/mounts/test-vault-config-operator/transit*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }

    path "/sys/mounts/test-vault-config-operator/transit/tune" {
      capabilities = [ "create", "read", "update", "delete"]
    }

    path "test-vault-config-operator/transit/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
