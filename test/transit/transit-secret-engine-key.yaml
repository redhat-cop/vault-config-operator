apiVersion: redhatcop.redhat.io/v1alpha1
kind: TransitSecretEngineKey
metadata:
  name: my-transit-key
spec:
  authentication:
    path: kubernetes
    role: transit-engine-auth-role
    serviceAccount:
      name: default
  path: test-vault-config-operator/transit
  type: aes256-gcm96
  minDecryptionVersion: 0
  minEncryptionVersion: 0
  deletionAllowed: false
  exportable: false
  allowPlaintextBackup: false
