apiVersion: redhatcop.redhat.io/v1alpha1
kind: KubernetesAuthEngineRole
metadata:
  name: transit-engine-auth-role
spec:
  authentication:
    path: kubernetes
    role: policy-admin
  path: kubernetes
  policies:
    - transit-engine-admin
  targetServiceAccounts:
    - default
  targetNamespaces:
    targetNamespaces:
      - test-vault-config-operator
