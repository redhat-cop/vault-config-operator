apiVersion: redhatcop.redhat.io/v1alpha1
kind: ConsulSecretEngineConfig
metadata:
  name: consul-config-test
  namespace: test-vault-config-operator
spec:
  authentication:
    path: kubernetes
    role: vault-admin
  path: consul
  address: "127.0.0.1:8500"
  scheme: "http"
  rootCredentials:
    secret:
      name: consul-token-secret
    passwordKey: token
