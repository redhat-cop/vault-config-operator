apiVersion: redhatcop.redhat.io/v1alpha1
kind: TOTPSecretEngineKey
metadata:
  name: my-totp-key
spec:
  authentication:
    path: kubernetes
    role: totp-engine-auth-role
    serviceAccount:
      name: default
  path: test-vault-config-operator/totp
  generate: true
  issuer: TestOrg
  accountName: testuser@example.com
  algorithm: SHA1
  digits: 6
  period: 30
