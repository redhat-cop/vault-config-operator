apiVersion: redhatcop.redhat.io/v1alpha1
kind: TOTPSecretEngineKey
metadata:
  name: my-totp-import-key
spec:
  authentication:
    path: kubernetes
    role: totp-engine-auth-role
    serviceAccount:
      name: default
  path: test-vault-config-operator/totp
  generate: false
  key: JBSWY3DPEHPK3PXP
  issuer: ImportOrg
  accountName: importuser@example.com
  algorithm: SHA1
  digits: 6
  period: 30
