apiVersion: redhatcop.redhat.io/v1alpha1
kind: GCPSecretEngineStaticAccount
metadata:
  name: my-static-account
spec:
  authentication:
    path: kubernetes
    role: gcp-engine-admin
  path: gcp
  secretType: access_token
  serviceAccountEmail: example@my-gcp-project.iam.gserviceaccount.com
  bindings: |
    resource "//cloudresourcemanager.googleapis.com/projects/my-gcp-project" {
      roles = ["roles/viewer"]
    }
  tokenScopes:
    - https://www.googleapis.com/auth/cloud-platform
