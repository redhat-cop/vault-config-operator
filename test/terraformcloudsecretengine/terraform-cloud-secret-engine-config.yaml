apiVersion: redhatcop.redhat.io/v1alpha1
kind: TerraformCloudSecretEngineConfig
metadata:
  name: tfc-config
spec:
  authentication:
    path: kubernetes
    role: tfc-engine-admin
  path: terraform
  address: "https://app.terraform.io"
  tfcCredentials:
    secret:
      name: tfc-api-token
    passwordKey: token
